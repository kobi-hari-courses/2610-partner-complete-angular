@if(isQuizDone()) {
    <app-summary [score]="score()"/>
} @else {
    <app-progress-bar
        [total]="totalQuestionsCount()"
        [value]="answeredQuestionsCount()"
    />
    <app-question-presenter [question]="currentQuestion()"
        (userAnswered)="answerCurrentQuestion($event)"
    />    
}

<button (click)="reset()">Restart Quiz</button>
