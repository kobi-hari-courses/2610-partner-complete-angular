<div class="title-area">
   <app-title 
    caption="Welcome To Notepad App"
    [color]="selectedColor()"
    (whatever)="whenClickedManyTimes($event)"
    />
</div>

<div class="colors-area">
    <app-string-selector 
        [options]="possibleColors()"
        [(selected)]="selectedColor"
        />
</div>

<div class="fonts-area">
    <app-string-selector 
        [options]="possibleFonts()"
        [(selected)]="selectedFont"
        />
</div>

<div class="sizes-area">
    <app-string-selector 
        [options]="possibleSizes()"
        [(selected)]="selectedSize"
        />
</div>

<div class="text-area">
    <textarea
        [style.color]="selectedColor()"
        [style.font-family]="selectedFont()"
        [style.font-size]="selectedSize()"
    ></textarea>
</div>
