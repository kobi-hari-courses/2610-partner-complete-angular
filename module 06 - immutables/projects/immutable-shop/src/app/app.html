<div class="catalogue">
  @for(product of products(); track product.id) {
    <div class="product">
      <div class="name">{{product.name}}</div>
      <div class="price">{{product.price}}</div>
      <button (click)="incrementProduct(product)">+</button>
    </div>
  }
</div>
<div class="cart">
  <div class="customer">
    <input type="text" [value]="cart().customer"
      #textBox
      (input)="updateCustomerName(textBox.value)"
    />
  </div>
  <ul>
    @for(item of cart().items; track $index) {
      <li>
        <div class="product">{{item.product.name}}</div>
        <div class="quantity">{{item.quantity}}</div>
        <button (click)="incrementProduct(item.product)">+</button>
        <button (click)="decrementProduct(item.product)">-</button>
      </li>
    }
  </ul>

</div>
